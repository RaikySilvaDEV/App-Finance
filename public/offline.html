<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>FinPulse — Sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #09090b; color: #e2e8f0; font: 16px/1.6 system-ui,sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 420px; border: 1px solid #27272a; border-radius: 20px; padding: 32px; background: #101012; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 24px; line-height: 1.3; margin: 24px 0 12px; }
    p { color: #94a3b8; font-size: 15px; }
    a { display: block; margin-top: 24px; text-align: center; background: #a78bfa; color: #09090b; font-weight: 700; padding: 12px; border-radius: 10px; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body><main>
  <img src="/icons/icon-192.png" alt="FinPulse">
  <h1>Você está sem conexão</h1>
  <p>Conecte-se à internet para entrar e consultar seus dados financeiros.</p>
  <p>Login, saldos, movimentações e importações não ficam disponíveis offline.</p>
  <a href="/">Tentar abrir o FinPulse</a>
</main></body>
</html>
